name: Verificar Java e MySQL
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integracao:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root_ci_apenas
          MYSQL_DATABASE: escola_maximus
          MYSQL_USER: aluno_java
          MYSQL_PASSWORD: MaximusLocal_2026!
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_ci_apenas"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Preparar banco vazio
        env:
          MYSQL_PWD: root_ci_apenas
        run: mysql --protocol=TCP -h127.0.0.1 -uroot < sql/01_banco.sql
      - name: Compilar todos os exemplos
        run: mvn --batch-mode clean compile dependency:copy-dependencies
      - name: Executar e conferir as dez respostas
        env:
          MYSQL_PWD: root_ci_apenas
        run: python3 tests/verificar.py
